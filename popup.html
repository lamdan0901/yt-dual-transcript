<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>YT Translate & Speak</h3>
  <div class="section">
    <label>Target Language:</label>
    <select id="target-lang">
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="hi">Hindi</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
      <option value="ar">Arabic</option>
      <option value="it">Italian</option>
      <option value="vi">Vietnamese</option>
      <!-- Supports 90+ dynamically mapped if needed -->
    </select>
  </div>
  
  <div class="section">
    <button id="translate-btn">▶ Translate</button>
  </div>

  <div class="section">
    <label><input type="checkbox" id="read-aloud"> Read Aloud (TTS)</label>
  </div>

  <div class="section">
    <label>Soniox STT API Key (Optional):</label>
    <input type="password" id="soniox-key" placeholder="Enter API Key for no-subs">
    <button id="start-stt-btn" style="display:none; margin-top:5px; background-color:#4CAF50;">Start STT</button>
  </div>

  <div class="section">
    <h4>Style Settings</h4>
    <label>Font Size:</label>
    <input type="range" id="font-size" min="12" max="48" value="24">
    <br>
    <label>Text Color:</label>
    <input type="color" id="text-color" value="#ffffff">
    <br>
    <label>Background Opacity:</label>
    <input type="range" id="bg-opacity" min="0" max="100" value="75">
  </div>

  <div class="section">
    <button id="download-srt-btn" style="background-color: #2196F3;">Download SRT</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
