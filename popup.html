<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>

    <!-- Header -->
    <div class="popup-header">
      <span class="brand-icon">▶</span>
      <span class="brand-text">YT Translate <span class="brand-accent">&amp; Speak</span></span>
    </div>

    <!-- Group 1: Translation -->
    <div class="section">
      <div class="toggle-row">
        <span class="toggle-label">Enable Translation</span>
        <label class="toggle-switch">
          <input type="checkbox" id="translation-enabled" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="lang-row">
        <select id="source-lang">
          <option value="auto">Auto Detect</option>
        </select>
        <span class="lang-arrow">→</span>
        <select id="target-lang">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="hi">Hindi</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="ar">Arabic</option>
          <option value="it">Italian</option>
          <option value="vi">Vietnamese</option>
        </select>
      </div>

      <button id="translate-btn">▶ Translate</button>
    </div>

    <!-- Group 2: Options -->
    <div class="section">
      <div class="section-title">Options</div>

      <div class="toggle-row">
        <span class="toggle-label">Read Aloud (TTS)</span>
        <label class="toggle-switch">
          <input type="checkbox" id="read-aloud" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Show Only Target Language</span>
        <label class="toggle-switch">
          <input type="checkbox" id="hide-source-text" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Adaptive Transcript Position</span>
        <label class="toggle-switch">
          <input type="checkbox" id="adaptive-overlay-position" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="field-row">
        <label class="field-label" for="soniox-key">Soniox STT API Key (Optional)</label>
        <input type="password" id="soniox-key" placeholder="Enter API key for videos without subtitles" />
      </div>

      <button id="start-stt-btn" class="btn-secondary" style="display: none">
        Start STT
      </button>
    </div>

    <!-- Group 3: Style -->
    <div class="section">
      <div class="section-title">Style</div>

      <div class="slider-row">
        <label class="field-label" for="font-size">Font Size</label>
        <div class="slider-control">
          <input type="range" id="font-size" min="12" max="48" value="24" />
          <span class="value-text" id="font-size-value">24px</span>
        </div>
      </div>

      <div class="color-row">
        <label class="field-label" for="text-color" style="margin-bottom: 0">Text Color</label>
        <input type="color" id="text-color" value="#ffffff" />
      </div>

      <div class="slider-row">
        <label class="field-label" for="bg-opacity">Background Opacity</label>
        <div class="slider-control">
          <input type="range" id="bg-opacity" min="0" max="100" value="75" />
          <span class="value-text" id="bg-opacity-value">75%</span>
        </div>
      </div>

      <div class="slider-row">
        <label class="field-label" for="source-size-factor">Source Text Scale</label>
        <div class="slider-control">
          <input type="range" id="source-size-factor" min="0.5" max="2" step="0.1" value="0.8" />
          <span class="value-text" id="source-size-value">0.8x</span>
        </div>
      </div>

      <div class="slider-row">
        <label class="field-label" for="target-size-factor">Target Text Scale</label>
        <div class="slider-control">
          <input type="range" id="target-size-factor" min="0.5" max="2" step="0.1" value="1.2" />
          <span class="value-text" id="target-size-value">1.2x</span>
        </div>
      </div>
    </div>

    <!-- Group 4: Export -->
    <div class="section">
      <button id="download-srt-btn" class="btn-tertiary">⬇ Download SRT</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
